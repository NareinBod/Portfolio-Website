<nav class="dock" aria-label="Site navigation">
  @for (item of dockItems; track item.id) {
    <a
      [href]="'#' + item.id"
      class="dock-btn"
      [class.active]="activeSection() === item.id"
      [title]="item.label"
      [attr.aria-label]="item.label"
      (click)="goTo(item.id, $event)"
    >
      @switch (item.id) {
        @case ('top') {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>
          </svg>
        }
        @case ('work') {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/>
            <rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>
          </svg>
        }
        @case ('about') {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
          </svg>
        }
        @case ('experience') {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="8" width="18" height="12"/><path d="M9 8V5h6v3"/>
          </svg>
        }
        @case ('skills') {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13 2L4 14h7l-1 8 9-12h-7z"/>
          </svg>
        }
        @case ('contact') {
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14"/><path d="M3 6l9 7 9-7"/>
          </svg>
        }
      }
    </a>
  }
</nav>
