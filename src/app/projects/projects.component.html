<section class="work-section" aria-labelledby="work-heading">
  <div class="section-label">
    <span aria-hidden="true"></span>
    <span id="work-heading">SELECTED WORK</span>
    <span aria-hidden="true"></span>
  </div>

  <div class="project-list" aria-label="Selected projects">
    @for (project of projects; track project.n) {
      <a
        [href]="project.href"
        class="project-row"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="project.title + ' — ' + project.stack"
      >
        <span class="project-n" aria-hidden="true">{{ project.n }}</span>
        <span class="project-title">{{ project.title }} <span class="arrow" aria-hidden="true">↗</span></span>
        <span class="project-desc">{{ project.desc }}</span>
        <span class="project-stack">{{ project.stack }}</span>
      </a>
    }
  </div>
</section>
